<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوارق الشرق | منصة العمليات</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f3f5fb;--s:#fff;--s2:#eef1f8;--tx:#0d1530;--mu:#6b7592;--bd:#dfe4f0;--ac:#4f46e5;--ac2:#06b6d4;--ok:#0f9d58;--wn:#e08a00;--er:#d92d20;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#080d1d;--s:#111933;--s2:#18213f;--tx:#e9edfb;--mu:#8e9ab8;--bd:#232d50;--ac:#7c83ff;--ac2:#22d3ee;--ok:#34d399;--wn:#fbbf24;--er:#ff7b6e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#080d1d;--s:#111933;--s2:#18213f;--tx:#e9edfb;--mu:#8e9ab8;--bd:#232d50;--ac:#7c83ff;--ac2:#22d3ee;--ok:#34d399;--wn:#fbbf24;--er:#ff7b6e}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.55 "IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:50}
.mu,p.mu{color:var(--mu)}code{font-size:11px;background:var(--s2);padding:1px 6px;border-radius:6px;color:var(--mu)}
.sh0{padding-bottom:78px}.app{max-width:1100px;margin:0 auto}main{padding:0 14px 14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px)}
.br{display:flex;align-items:center;gap:10px}.lg0{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--ac),var(--ac2));display:grid;place-items:center;color:#fff;font-weight:700}
.br b{display:block;font-size:15px}.br small{color:var(--mu);font-size:11px}.me{display:flex;align-items:center;gap:8px;font-size:12px}
.live{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pl 1.8s infinite}@keyframes pl{70%{box-shadow:0 0 0 8px transparent}0%{box-shadow:0 0 0 0 var(--ok)}}
#nv{position:fixed;inset:auto 0 0 0;z-index:15;display:flex;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:var(--s);border-top:1px solid var(--bd)}
#nv button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-size:11px;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
#nv button i{font-style:normal;font-size:17px}#nv button.on{color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
#nv u{position:absolute;top:2px;inset-inline-end:14%;background:var(--er);color:#fff;text-decoration:none;font-size:10px;min-width:17px;height:17px;border-radius:9px;display:grid;place-items:center}
@media(min-width:900px){.sh0{padding:0}.app{display:grid;grid-template-columns:220px 1fr}header{grid-column:2;grid-row:1}main{grid-column:2}
#nv{position:sticky;top:0;grid-column:1;grid-row:1/3;height:100vh;flex-direction:column;justify-content:flex-start;padding:76px 12px;border:0;border-inline-end:1px solid var(--bd);inset:auto}#nv button{flex:none;flex-direction:row;font-size:14px;padding:11px 14px;gap:10px}}
h2{font-size:20px;margin:6px 0 2px}h3{font-size:15px;margin:6px 0 2px}p{margin:2px 0}
.cd{background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px #0001}
.cd.ret{border-color:var(--er);background:color-mix(in srgb,var(--er) 6%,var(--s))}.cd.urg{border-inline-start:4px solid var(--er)}
.tp{display:flex;justify-content:space-between;gap:8px}.rt{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.k{font-size:11px;font-weight:700;color:#fff;padding:2px 9px;border-radius:20px}.k.hire{background:#7c3aed}.k.con{background:var(--ac)}
.pl,.chip{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;white-space:nowrap;background:color-mix(in srgb,currentColor 14%,transparent)}
.ok{color:var(--ok)}.wn{color:var(--wn)}.er{color:var(--er)}.mu.pl{color:var(--mu)}
.ch{display:flex;align-items:center;gap:4px;margin:10px 0 2px}.ch em{flex:1;height:2px;background:var(--bd);min-width:6px}
.cn{font-size:11px;padding:4px 10px;border-radius:20px;background:var(--s2);color:var(--mu);border:1px solid var(--bd);white-space:nowrap}
.cn.d{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok);border-color:transparent}.cn.c{background:var(--ac);color:#fff;border-color:transparent;animation:pu 1.6s infinite}.cn.x{background:var(--er);color:#fff;border-color:transparent}
@keyframes pu{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--ac) 25%,transparent)}}
.stp{display:flex;margin:16px 0 8px}.sn{flex:1;text-align:center;position:relative;font-size:10px;color:var(--mu)}
.sn b{display:grid;place-items:center;width:22px;height:22px;margin:0 auto 4px;border-radius:50%;background:var(--s2);border:2px solid var(--bd);font-size:11px;position:relative;z-index:1}
.sn::before{content:"";position:absolute;top:10px;inset-inline-start:-50%;width:100%;height:2px;background:var(--bd)}.sn:first-child::before{display:none}
.sn.d b{background:var(--ac);border-color:var(--ac);color:#fff}.sn.d::before,.sn.c::before{background:var(--ac)}
.sn.c b{border-color:var(--ac);color:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent)}.sn.c{color:var(--tx);font-weight:700}
.lg{font-size:12px;color:var(--mu);border-top:1px dashed var(--bd);padding-top:8px;margin-top:6px}.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.b{border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:10px 16px;border-radius:11px;font:inherit;font-weight:700;cursor:pointer}
.b.s{padding:7px 13px;font-size:13px}.b.l{background:var(--s2);color:var(--tx)}.b.g{background:var(--ok)}.b.r{background:var(--er)}.b.w{width:100%;margin-top:14px}
label{display:block;font-size:12px;color:var(--mu);margin:12px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:11px;background:var(--s2);color:var(--tx);font:inherit}textarea{min-height:84px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}@media(min-width:700px){.kp{grid-template-columns:repeat(4,1fr)}}
.kc{background:var(--s);border:1px solid var(--bd);border-radius:16px;padding:14px}.kc b{display:block;font-size:26px;line-height:1.2}.kc span{font-size:12px;color:var(--mu)}
.fn{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}.fn span:first-child{width:74px;color:var(--mu)}.fn div{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--ac),var(--ac2));min-width:4px}
.ev{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--bd)}.ev i{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--ac);flex:none}
.ev i.ok2{background:var(--ok)}.ev i.ret,.ev i.rej{background:var(--er)}.ev i.fwd{background:var(--ac2)}.ev p{margin:0}.ev small{color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px 6px;text-align:start;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:600;font-size:12px}
.em{text-align:center;color:var(--mu);padding:36px 10px}.ban{padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--wn) 14%,transparent);color:var(--wn);font-weight:700;margin-bottom:10px}.ban.e{background:color-mix(in srgb,var(--er) 12%,transparent);color:var(--er)}
#ts{position:fixed;inset-inline:14px;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:60;background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:14px;display:none;box-shadow:0 8px 30px #0005}
.wl{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 16px;position:relative;overflow:hidden;text-align:center}
.au{position:absolute;inset:-30%;background:radial-gradient(40% 40% at 25% 30%,color-mix(in srgb,var(--ac) 50%,transparent),transparent),radial-gradient(35% 35% at 75% 65%,color-mix(in srgb,var(--ac2) 45%,transparent),transparent);filter:blur(50px);animation:dr 12s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(6%,-5%) rotate(8deg) scale(1.08)}}.wl>*:not(.au){position:relative}
.hl{font-size:32px;font-weight:700;line-height:1.3;margin:0}.hl span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.gl{font-size:20px;font-weight:700}.pcs{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:520px}
.pc{border:1px solid var(--bd);background:color-mix(in srgb,var(--s) 80%,transparent);backdrop-filter:blur(10px);border-radius:18px;padding:16px 10px;color:var(--tx);font:inherit;cursor:pointer;transition:transform .2s}
.pc:active,.pc:hover{transform:translateY(-3px)}.pc .av{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:22px;font-weight:700;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.pc.owner .av{background:linear-gradient(135deg,#f59e0b,#ef4444)}.pc.ops .av{background:linear-gradient(135deg,#7c3aed,var(--ac))}.pc b{display:block}.pc small{color:var(--mu)}
.sh{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:40}.sh>div{width:100%;max-width:440px;background:var(--s);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));text-align:start}
.cl{background:none;border:0;color:var(--mu);font:inherit;float:left;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div><div id="ts"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const ACC=[{k:'saeed',n:'سعيد علي',r:'owner',t:'المالك'},{k:'ibrahim',n:'إبراهيم غانم',r:'ops',t:'مدير التشغيل'},{k:'ahmed',n:'أحمد الزروق',r:'sup',t:'مشرف'},{k:'fateh',n:'الفاتح',r:'sup',t:'مشرف'}];
const FLOW={hire:['استقطاب','فرز','مقابلة','عرض وظيفي','مباشرة'],con:['تواصل','عرض','تفاوض','توقيع','تنفيذ','تجديد']},KIND={hire:'توظيف',con:'تعاقد'};
const STT={ops:['عند مدير التشغيل','wn'],owner:['عند المالك','wn'],returned:['مرتجع للتعديل','er'],approved:['معتمد نهائيًا','ok'],rejected:['مرفوض','mu']};
const NAV={sup:[['mine','مهامي','◧'],['new','جديد','＋'],['me','حسابي','◍']],ops:[['queue','المراجعة','✓'],['perf','الفريق','◔'],['me','حسابي','◍']],owner:[['inbox','قراراتي','✦'],['exec','نظرة','◉'],['feed','النشاط','≡'],['me','حسابي','◍']]};
let S={cases:[],acc:{},me:null,page:null,first:true,fail:0,lock:0,pick:null},db;
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const A=k=>ACC.find(a=>a.k===k)||{},nm=k=>A(k).n||'—',role=()=>A(S.me).r,isDef=()=>!S.acc[S.me];
const fmt=t=>new Date(t).toLocaleString('ar-SA',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?'الآن':m<60?m+' د':m<1440?Math.round(m/60)+' س':Math.round(m/1440)+' يوم'};
function toast(m){const t=$('#ts');t.textContent=m;t.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',5000);try{navigator.vibrate&&navigator.vibrate(90)}catch(e){}}
async function hash(k,p){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('bwr|'+k+'|'+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function check(k,p){const d=S.acc[k];return d?d.h===await hash(k,p):p==='1234'}
const CH=['مشرف','مدير التشغيل','المالك','معتمد'];
const chain=(c,n)=>{const p={ops:1,owner:2,approved:4,returned:0,rejected:0}[c.status],bad=c.status==='returned'||c.status==='rejected';return `<div class="ch">${CH.slice(0,n||4).map((s,i)=>`<div class="cn ${i<p?'d':i===p?(bad?'x':'c'):''}">${s}</div>`).join('<em></em>')}</div>`};
const stepper=c=>`<div class="stp">${FLOW[c.kind].map((s,i)=>`<div class="sn ${i<c.stage?'d':i==c.stage?'c':''}"><b>${i<c.stage?'✓':i+1}</b>${s}</div>`).join('')}</div>`;
function card(c,act){const h=(Date.now()-c.upd)/36e5,st=STT[c.status],l=c.log[c.log.length-1]||{},w=c.status==='ops'||c.status==='owner';
 const sla=w?`<span class="chip ${h>48?'er':h>24?'wn':'ok'}">⏱ ${h<1?'<1':Math.round(h)}س${h>48?' · تصعيد':''}</span>`:'';
 return `<article class="cd ${c.status==='returned'?'ret':''} ${c.prio==='urgent'?'urg':''}"><div class="tp"><div><span class="k ${c.kind}">${KIND[c.kind]}</span> <code>${esc(c.code)}</code><h3>${esc(c.title)}</h3><p class="mu">${esc(nm(c.owner))} · ${ago(c.at)}${c.value?' · '+esc(c.value)+' ر.س':''}</p></div><div class="rt"><span class="pl ${st[1]}">${st[0]}</span>${sla}</div></div>${chain(c)}${stepper(c)}<p class="lg">${esc(nm(l.u))}: ${esc(l.x||'')}</p>${act?`<div class="acts">${act}</div>`:''}</article>`}
const bt=(a,id,t,c)=>`<button class="b s ${c||''}" data-a="${a}" data-id="${id}">${t}</button>`,kc=(v,t,c)=>`<div class="kc"><b class="${c||''}">${v}</b><span>${t}</span></div>`;
const evs=n=>S.cases.flatMap(c=>c.log.map(l=>({l,c}))).sort((a,b)=>b.l.t-a.l.t).slice(0,n).map(({l,c})=>`<div class="ev"><i class="${l.a}"></i><div><p><b>${esc(nm(l.u))}</b> · <code>${esc(c.code)}</code> ${esc(c.title)}</p><p class="mu">${esc(l.x)}</p><small>${fmt(l.t)}</small></div></div>`).join('')||'<div class="em">لا نشاط بعد</div>';
const defban=()=>isDef()?`<div class="ban">🔑 تستخدم كلمة المرور الافتراضية (1234) — <a href="#" data-p="me" style="color:inherit">غيّرها الآن</a></div>`:'';
const mineList=()=>S.cases.filter(c=>c.owner===S.me),stat=s=>S.cases.filter(c=>c.status===s);
const badge=()=>({sup:mineList().filter(c=>c.status==='returned').length,ops:stat('ops').length,owner:stat('owner').length}[role()]||0);

const PAGES={
mine(){const m=mineList().sort((a,b)=>b.upd-a.upd),r=m.filter(c=>c.status==='returned'),last=c=>FLOW[c.kind].length-1;
 return `<h2>مهامي</h2><p class="mu">أهلًا ${esc(nm(S.me))} — هذه ملفاتك فقط</p>${defban()}<div class="kp">${kc(m.length,'ملفاتي')}${kc(r.length,'مرتجعة','er')}${kc(m.filter(c=>c.status==='ops'||c.status==='owner').length,'قيد المراجعة','wn')}${kc(m.filter(c=>c.status==='approved').length,'معتمدة','ok')}</div>`+(r.length?`<div class="ban e">⚠ لديك ${r.length} ملف مرتجع — عدّلها أولًا</div>`:'')+
 (m.map(c=>card(c,c.status==='returned'?bt('resub',c.id,'تعديل وإعادة إرسال'):c.status==='approved'&&c.stage<last(c)?bt('adv',c.id,'التقدم: '+FLOW[c.kind][c.stage+1])+bt('note',c.id,'＋ ملاحظة','l'):bt('note',c.id,'＋ ملاحظة','l'))).join('')||'<div class="em">لا ملفات بعد — ابدأ بـ«جديد»</div>')},
new(){return `<h2>مستجد جديد</h2><div class="cd">${chain({status:'ops'},3)}<p class="mu">يصل تلقائيًا لمدير التشغيل، ثم للمالك للاعتماد النهائي</p><div class="g2"><div><label>النوع</label><select id="fk"><option value="hire">توظيف</option><option value="con">تعاقد</option></select></div><div><label>الأولوية</label><select id="fp"><option value="normal">عادي</option><option value="high">مهم</option><option value="urgent">عاجل</option></select></div></div>
 <label id="fl"></label><input id="ft"><div class="g2"><div><label>المرحلة الحالية</label><select id="fs"></select></div><div><label>القيمة (ر.س)</label><input id="fv" inputmode="numeric"></div></div><label>التفاصيل والخطوة القادمة</label><textarea id="fn"></textarea><button class="b w" data-a="create">إرسال للمراجعة</button></div>`},
queue(){const q=stat('ops').sort((a,b)=>a.upd-b.upd),late=q.filter(c=>Date.now()-c.upd>864e5).length;
 return `<h2>قائمة المراجعة</h2><p class="mu">أهلًا ${esc(nm(S.me))} — الأقدم أولًا، مهلتك 24 ساعة</p>${defban()}<div class="kp">${kc(q.length,'بانتظارك','wn')}${kc(late,'متأخرة','er')}${kc(stat('owner').length,'عند المالك')}${kc(stat('approved').length,'معتمدة','ok')}</div>`+(q.map(c=>card(c,bt('fwd',c.id,'اعتماد وإحالة للمالك','g')+bt('ret',c.id,'إرجاع للمشرف','l')+bt('rej',c.id,'رفض','r'))).join('')||'<div class="em">✓ لا شيء بانتظارك</div>')},
perf(){const sups=ACC.filter(a=>a.r==='sup');return `<h2>أداء المشرفين</h2><div class="cd"><table><tr><th>المشرف</th><th>الكل</th><th>معلّق</th><th>معتمد</th><th>مرتجع</th></tr>${sups.map(a=>{const m=S.cases.filter(c=>c.owner===a.k),f=s=>m.filter(c=>c.status===s).length;return `<tr><td>${esc(a.n)}</td><td>${m.length}</td><td class="wn">${f('ops')+f('owner')}</td><td class="ok">${f('approved')}</td><td class="er">${f('returned')}</td></tr>`}).join('')}</table></div>`},
inbox(){const q=stat('owner').sort((a,b)=>a.upd-b.upd),e=stat('ops').filter(c=>Date.now()-c.upd>1728e5);
 return `<h2>قراراتي</h2><p class="mu">أهلًا ${esc(nm(S.me))} — الملفات التي اعتمدها مدير التشغيل وتنتظر قرارك</p>${defban()}`+(e.length?`<div class="ban e">⚠ ${e.length} ملف متأخر +48 ساعة عند مدير التشغيل</div>`:'')+(q.map(c=>card(c,bt('ok',c.id,'اعتماد نهائي','g')+bt('ret',c.id,'إرجاع','l')+bt('rej',c.id,'رفض','r'))).join('')||'<div class="em">✓ لا قرارات معلّقة</div>')},
exec(){const T=S.cases,W=T.filter(c=>c.status==='ops'||c.status==='owner'),V=T.filter(c=>c.kind==='con'&&c.status==='approved').reduce((s,c)=>s+(parseFloat(String(c.value).replace(/[^\d.]/g,''))||0),0);
 const fun=k=>{const n=FLOW[k].map((_,i)=>T.filter(c=>c.kind===k&&c.stage===i).length),mx=Math.max(1,...n);return `<div class="cd"><h3>${KIND[k]} — توزيع المراحل</h3>${FLOW[k].map((s,i)=>`<div class="fn"><span>${s}</span><div style="width:${n[i]/mx*70}%"></div><b>${n[i]}</b></div>`).join('')}</div>`};
 return `<h2>نظرة تنفيذية</h2><p class="mu">مباشر — يتحدث لحظيًا</p><div class="kp">${kc(T.length,'إجمالي الملفات')}${kc(W.length,'قيد الاعتماد','wn')}${kc(T.filter(c=>c.status==='returned').length,'مرتجعة','er')}${kc(V.toLocaleString('ar-SA'),'قيمة العقود المعتمدة (ر.س)','ok')}</div>${fun('con')}${fun('hire')}<div class="cd"><h3>آخر النشاط</h3>${evs(6)}</div>`},
feed(){return `<h2>سجل النشاط</h2><p class="mu">سجل تدقيق كامل: من فعل ماذا ومتى</p><div class="cd">${evs(60)}</div>`},
me(){const a=A(S.me),r=role(),rs=ACC.filter(x=>x.k!==S.me&&(r==='owner'||(r==='ops'&&x.r==='sup')));
 return `<h2>حسابي</h2><div class="cd"><b>${esc(a.n)}</b> · <span class="mu">${a.t}</span>${defban()}<label>كلمة المرور الحالية</label><input id="p0" type="password"><label>كلمة المرور الجديدة (4 أحرف+)</label><input id="p1" type="password"><label>تأكيد الجديدة</label><input id="p2" type="password"><button class="b w" data-a="chpw">حفظ كلمة المرور</button></div>`+
 (rs.length?`<div class="cd"><h3>إدارة كلمات المرور</h3><p class="mu">إعادة التعيين ترجع كلمة المرور إلى 1234</p>${rs.map(x=>`<div class="tp" style="align-items:center;margin:10px 0"><span>${esc(x.n)} <small class="mu">${x.t}${S.acc[x.k]?'':' · افتراضية'}</small></span>${bt('rst',x.k,'إعادة تعيين','l')}</div>`).join('')}</div>`:'')+`<button class="b w r" data-a="out">تسجيل الخروج</button>`}};

function welcome(){const h=new Date().getHours();
 return `<div class="wl"><div class="au"></div><div class="lg0" style="width:64px;height:64px;font-size:28px;border-radius:20px">ب</div>
 <div class="gl">${h<12?'صباح الخير ☀️':'مساء الخير 🌙'}</div><h1 class="hl">بوارق الشرق<br><span>للخدمات اللوجستية</span></h1><p class="mu">منصة العمليات والرقابة · الدمام / الخبر</p>
 <svg viewBox="0 0 320 60" style="width:100%;max-width:340px"><path id="rt" d="M5 45 C60 5,110 55,160 30 S270 5,315 40" fill="none" stroke="var(--ac)" stroke-width="2" stroke-dasharray="4 6" opacity=".6"/><circle r="6" fill="var(--ac2)"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#rt"/></animateMotion></circle><circle cx="5" cy="45" r="5" fill="var(--ac)"/><circle cx="315" cy="40" r="5" fill="var(--ok)"/></svg>
 ${chain({status:'ops'},3)}<p class="mu" style="margin-top:6px">اختر هويتك للدخول</p>
 <div class="pcs">${ACC.map(a=>`<button class="pc ${a.r}" data-pick="${a.k}"><div class="av">${esc(a.n[0])}</div><b>${esc(a.n)}</b><small>${a.t}</small></button>`).join('')}</div></div>`+
 (S.pick?`<div class="sh" data-cl><div><button class="cl" data-cl>✕</button><h3>${esc(nm(S.pick))}</h3><p class="mu">${A(S.pick).t} — أدخل كلمة المرور</p><label>كلمة المرور</label><input id="pw" type="password" autocomplete="current-password"><p id="er" class="er" style="min-height:20px;font-size:12px"></p><button class="b w" data-a="login">دخول</button></div></div>`:'')}
function shell(){const r=role(),nav=NAV[r];if(!nav.find(n=>n[0]===S.page))S.page=nav[0][0];const bg=badge();
 return `<div class="sh0"><div class="app"><header><div class="br"><div class="lg0">ب</div><div><b>بوارق الشرق</b><small>${A(S.me).t} · ${esc(nm(S.me))}</small></div></div><div class="me"><span class="live"></span><button class="b s l" data-a="out">خروج</button></div></header>
 <nav id="nv">${nav.map((n,i)=>`<button data-p="${n[0]}" class="${n[0]===S.page?'on':''}"><i>${n[2]}</i>${n[1]}${i===0&&bg?`<u>${bg}</u>`:''}</button>`).join('')}</nav><main>${PAGES[S.page]()}</main></div></div>`}
function render(){const f=document.activeElement;if(f&&/INPUT|TEXTAREA|SELECT/.test(f.tagName)&&$('#app').contains(f))return;
 $('#app').innerHTML=S.me?shell():welcome();if(S.me&&S.page==='new')fsync();if(S.pick&&$('#pw'))$('#pw').focus()}
function go(){const f=document.activeElement;f&&f.blur&&f.blur();render()}
function fsync(){const k=$('#fk').value;$('#fs').innerHTML=FLOW[k].map((s,i)=>`<option value="${i}">${s}</option>`).join('');$('#fl').textContent=k==='hire'?'اسم المرشح / الوظيفة':'اسم العميل / العقد'}
const setErr=m=>{const e=$('#er');if(e)e.textContent=m};

async function act(a,id){
 if(a==='login'){const p=$('#pw').value;if(Date.now()<S.lock)return setErr('محاولات كثيرة — انتظر دقيقة');
  if(await check(S.pick,p)){S.me=S.pick;S.pick=null;S.fail=0;S.page=null;try{sessionStorage.setItem('bwr',S.me)}catch(e){}go()}else{if(++S.fail>=5){S.lock=Date.now()+6e4;S.fail=0}setErr('كلمة المرور غير صحيحة')}return}
 if(a==='out'){S.me=null;try{sessionStorage.removeItem('bwr')}catch(e){}go();return}
 if(!db)return toast('النظام غير متصل');const t=Date.now();
 if(a==='chpw'){const p0=$('#p0').value,p1=$('#p1').value;if(!await check(S.me,p0))return toast('كلمة المرور الحالية خطأ');if(p1.length<4)return toast('الجديدة قصيرة (4 أحرف+)');if(p1!==$('#p2').value)return toast('التأكيد غير مطابق');
  try{await db.collection('accounts').doc(S.me).set({h:await hash(S.me,p1),t});toast('تم تغيير كلمة المرور ✓');go()}catch(e){toast('تعذر الحفظ')}return}
 if(a==='rst'){if(confirm('إعادة تعيين كلمة مرور '+nm(id)+' إلى 1234؟')){try{await db.collection('accounts').doc(id).delete();toast('تمت إعادة التعيين')}catch(e){toast('تعذر التنفيذ')}}return}
 if(a==='create'){const ti=$('#ft').value.trim();if(!ti)return toast('اكتب العنوان');const nt=$('#fn').value.trim(),k=$('#fk').value,i='c'+t.toString(36)+Math.random().toString(36).slice(2,5);
  try{await db.collection('cases').doc(i).set({code:'BS-'+t.toString(36).slice(-5).toUpperCase(),kind:k,title:ti,value:$('#fv').value.trim(),stage:+$('#fs').value,prio:$('#fp').value,owner:S.me,status:'ops',at:t,upd:t,log:[{t,u:S.me,a:'create',x:'رفع مستجد'+(nt?': '+nt:'')}]});toast('أُرسل لمدير التشغيل ✓');S.page='mine';go()}catch(e){toast('تعذر الإرسال: '+(e.message||e.code))}return}
 const c=S.cases.find(x=>x.id===id);if(!c)return;let st=c.status,sg=c.stage,x,n,up=t,ac=a;
 if(a==='adv'){sg++;st='ops';x='ترقية إلى: '+FLOW[c.kind][sg]}
 else if(a==='resub'){n=prompt('ماذا عدّلت؟');if(!n)return;st='ops';x='إعادة إرسال: '+n;ac='create'}
 else if(a==='note'){n=prompt('الملاحظة:');if(!n)return;x=n;up=c.upd}
 else if(a==='fwd'){st='owner';x='اعتماد وإحالة للمالك';ac='fwd'}
 else if(a==='ok'){st='approved';x='اعتماد نهائي لمرحلة «'+FLOW[c.kind][c.stage]+'»';ac='ok2'}
 else{n=prompt(a==='ret'?'سبب الإرجاع (مطلوب):':'سبب الرفض (مطلوب):');if(!n)return;st=a==='ret'?'returned':'rejected';x=(a==='ret'?'إرجاع: ':'رفض: ')+n}
 try{await db.collection('cases').doc(id).update({status:st,stage:sg,upd:up,log:c.log.concat({t,u:S.me,a:ac,x})})}catch(e){toast('تعذر التحديث: '+(e.message||e.code))}}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a],[data-p],[data-pick],[data-cl]');if(!b)return;if(b.dataset.cl!==undefined){if(e.target===b){S.pick=null;go()}return}
 if(b.dataset.pick){S.pick=b.dataset.pick;go()}else if(b.dataset.p){e.preventDefault();S.page=b.dataset.p;go();scrollTo(0,0)}else act(b.dataset.a,b.dataset.id)});
document.addEventListener('change',e=>{if(e.target.id==='fk')fsync()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='pw')act('login')});
function note(c){const d=c.doc.data(),l=d.log[d.log.length-1];if(!S.me||c.type==='removed'||c.doc.metadata.hasPendingWrites||l.u===S.me)return;const r=role();
 if(r==='ops'&&d.status==='ops')toast('🔔 '+nm(l.u)+': '+d.title+' — '+l.x);
 else if(r==='owner'&&d.status==='owner')toast('🔔 بانتظار قرارك: '+d.title);
 else if(r==='sup'&&d.owner===S.me&&['returned','approved','rejected','owner'].includes(d.status))toast('🔔 '+d.title+': '+l.x)}
const SUPA_URL = window.ENV && window.ENV.SUPABASE_URL;
const SUPA_KEY = window.ENV && window.ENV.SUPABASE_ANON_KEY;

function makeDb(sb){
  return {
    collection(name){
      return {
        doc(id){
          return {
            async set(d){
              const {error} = await sb.from(name).upsert({id, data:d, updated_at:new Date().toISOString()});
              if(error) throw error;
            },
            async update(p){
              const {data:row, error:e1} = await sb.from(name).select('data').eq('id', id).single();
              if(e1) throw e1;
              const {error} = await sb.from(name)
                .update({data:{...row.data, ...p}, updated_at:new Date().toISOString()})
                .eq('id', id);
              if(error) throw error;
            },
            async delete(){
              const {error} = await sb.from(name).delete().eq('id', id);
              if(error) throw error;
            }
          };
        },
        onSnapshot(cb, errCb){
          const m = new Map();
          const mk = (id,d)=>({id, data:()=>d, metadata:{hasPendingWrites:false}});
          const emit = (changes)=>cb({
            docs:[...m].map(([id,d])=>mk(id,d)),
            docChanges:()=>changes.map(c=>({type:c.type, doc:mk(c.id,c.d)}))
          });
          const load = async()=>{
            const {data, error} = await sb.from(name).select('id,data');
            if(error){ errCb && errCb(error); return; }
            m.clear();
            data.forEach(r=>m.set(r.id, r.data));
            emit([]);
          };
          sb.channel('rt-'+name)
            .on('postgres_changes', {event:'*', schema:'public', table:name}, p=>{
              if(p.eventType==='DELETE'){
                const id = p.old.id, d = m.get(id);
                m.delete(id);
                emit([{type:'removed', id, d}]);
              }else{
                const id = p.new.id, d = p.new.data;
                const type = m.has(id) ? 'modified' : 'added';
                m.set(id, d);
                emit([{type, id, d}]);
              }
            })
            .subscribe(s=>{
              if(s==='SUBSCRIBED') load();
              if(s==='CHANNEL_ERROR' && errCb) errCb(new Error('realtime'));
            });
        }
      };
    }
  };
}

async function init(){render();
 try{
  if(!SUPA_URL||!SUPA_KEY) throw new Error('missing env');
  db = makeDb(supabase.createClient(SUPA_URL, SUPA_KEY));
 }catch(e){ console.error(e); }
 if(!db){toast('تعذر الاتصال بقاعدة البيانات');return}
 db.collection('accounts').onSnapshot(s=>{S.acc={};s.docs.forEach(d=>S.acc[d.id]=d.data());render()});
 db.collection('cases').onSnapshot(s=>{if(!S.first)s.docChanges().forEach(note);S.cases=s.docs.map(d=>Object.assign({id:d.id},d.data()));S.first=false;render()},e=>toast('انقطع الاتصال'));
 setInterval(render,6e4)}
try{const k=sessionStorage.getItem('bwr');if(k&&A(k).k)S.me=k}catch(e){}
init();
</script>
